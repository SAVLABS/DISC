<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" role="img" aria-label="Composición abstracta de desarrollo profesional">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EFE6"/>
      <stop offset="55%" stop-color="#EDE6D8"/>
      <stop offset="100%" stop-color="#E4D9C4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A24B"/>
      <stop offset="50%" stop-color="#A67C35"/>
      <stop offset="100%" stop-color="#896328"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#8A7350" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="900" fill="url(#bg)"/>

  <!-- trama sutil -->
  <g stroke="#D8CCB4" stroke-width="1" opacity="0.45">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="750" x2="800" y2="750"/>
  </g>

  <!-- curva dorada decorativa -->
  <path d="M -60 60 C 220 120, 260 320, 200 520 C 150 700, 260 820, 420 960" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.9"/>
  <path d="M -20 40 C 260 100, 300 320, 240 530 C 190 710, 300 830, 460 970" fill="none" stroke="#C9A24B" stroke-width="1.2" opacity="0.5"/>

  <!-- círculo grande tenue -->
  <circle cx="560" cy="330" r="210" fill="#FFFFFF" opacity="0.35"/>
  <circle cx="560" cy="330" r="210" fill="none" stroke="#A67C35" stroke-width="1" opacity="0.35"/>

  <!-- tarjeta central (perfil) -->
  <g filter="url(#soft)">
    <rect x="300" y="230" width="380" height="250" rx="22" fill="url(#cardGlow)"/>
  </g>
  <rect x="300" y="230" width="380" height="250" rx="22" fill="none" stroke="#E8E4DD" stroke-width="1.5"/>

  <!-- barras de perfil dentro de la tarjeta -->
  <g>
    <rect x="336" y="278" width="308" height="10" rx="5" fill="#F0ECE3"/>
    <rect x="336" y="278" width="210" height="10" rx="5" fill="#DC3838" opacity="0.85"/>
    <rect x="336" y="318" width="308" height="10" rx="5" fill="#F0ECE3"/>
    <rect x="336" y="318" width="252" height="10" rx="5" fill="#EBAA19" opacity="0.9"/>
    <rect x="336" y="358" width="308" height="10" rx="5" fill="#F0ECE3"/>
    <rect x="336" y="358" width="164" height="10" rx="5" fill="#21885A" opacity="0.85"/>
    <rect x="336" y="398" width="308" height="10" rx="5" fill="#F0ECE3"/>
    <rect x="336" y="398" width="196" height="10" rx="5" fill="#2879C7" opacity="0.85"/>
  </g>
  <rect x="336" y="252" width="120" height="12" rx="6" fill="#202020" opacity="0.85"/>

  <!-- círculos DISC flotantes -->
  <g filter="url(#soft)">
    <circle cx="250" cy="560" r="46" fill="#DC3838"/>
    <circle cx="360" cy="610" r="46" fill="#EBAA19"/>
    <circle cx="470" cy="575" r="46" fill="#21885A"/>
    <circle cx="575" cy="625" r="46" fill="#2879C7"/>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="250" y="572">D</text>
    <text x="360" y="622">I</text>
    <text x="470" y="587">S</text>
    <text x="575" y="637">C</text>
  </g>

  <!-- destellos dorados -->
  <circle cx="668" cy="170" r="6" fill="#A67C35" opacity="0.7"/>
  <circle cx="140" cy="210" r="4" fill="#A67C35" opacity="0.55"/>
  <circle cx="720" cy="560" r="5" fill="#C9A24B" opacity="0.6"/>
  <circle cx="90" cy="700" r="7" fill="#C9A24B" opacity="0.4"/>
</svg>
